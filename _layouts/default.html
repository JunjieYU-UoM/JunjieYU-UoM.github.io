<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    {% include scripts.html %}
    <div style="text-align: center;">
      <!-- 把原来的 <a align="left"> 改成普通 div，并去掉 align 属性 -->
      <div>
        Total <span id="busuanzi_value_site_pv"></span> views.
      </div>

      <!-- 地图容器设置 margin: 0 auto 实现水平居中
      <div style="width:300px; height:190px; overflow:hidden; border-radius:8px; margin: 0 auto;">
        <script type="text/javascript" id="mapmyvisitors" 
                src="https://mapmyvisitors.com/map.js?cl=ffffff&w=a&t=m&d=X2vqsU7vh1lqhDkd2APPeaVP9au0ZEAyI0IC_jFVgMM">
        </script>
      </div>
       -->
    </div>
  </body>
</html>
